[language-server.phpantom]
command = "phpantom_lsp"

[language-server.hx-lsp]
command = "hx-lsp"

[language-server.hx-lsp.config]
markdown = false              # Disable markdown features
documentColor = true         # Enable document color

[[language]]
name = "php"
rulers = [120]
language-servers = [ "phpantom", "hx-lsp" ]

[[language]]
name = "blade"
roots = [".git", "composer.json"]
language-servers = [ "phpantom", "hx-lsp" ]
formatter = { command = "blade-formatter", args = ["--stdin"] }

[[language]]
name = "javascript"
formatter = { command = "prettier", args = ["--parser", "babel"] }
language-servers = [ "typescript-language-server", "hx-lsp" ]

[[language]]
name = "jsx"
formatter = { command = "prettier", args = ["--parser", "babel"] }
language-servers = [ "typescript-language-server", "hx-lsp" ]

[[language]]
name = "typescript"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = [ "typescript-language-server", "hx-lsp" ]

[[language]]
name = "tsx"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
language-servers = [ "typescript-language-server", "hx-lsp" ]

[[language]]
name = "json"
formatter = { command = "prettier", args = ["--parser", "json"] }
language-servers = [ "hx-lsp" ]

[[language]]
name = "css"
formatter = { command = "prettier", args = ["--parser", "css"] }
language-servers = [ "hx-lsp" ]

[[language]]
name = "html"
formatter = { command = "prettier", args = ["--parser", "html"] }
language-servers = [ "hx-lsp" ]

[[language]]
name = "vue"
formatter = { command = "prettier", args = ["--parser", "vue"] }
language-servers = [ "hx-lsp" ]

[[language]]
name = "markdown"
formatter = { command = "prettier", args = ["--parser", "markdown"] }
language-servers = [ "hx-lsp" ]

[[language]]
name = "yaml"
formatter = { command = "prettier", args = ["--parser", "yaml"] }
language-servers = [ "hx-lsp" ]



[[language]]
name = "stub"
scope = "text.stub"
file-types = []
shebangs = []
roots = []
auto-format = false
language-servers = [ "hx-lsp" ]
